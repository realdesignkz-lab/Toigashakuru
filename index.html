<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ұзату тойға шақыру</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      color: #333;
      text-align: center;
      overflow-x: hidden;
    }
    header {
      padding: 50px 20px;
      animation: fadeIn 2s ease-in-out;
    }
    h1 {
      font-size: 2.5em;
      color: #fff;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }
    p {
      font-size: 1.2em;
    }
    .invite {
      background: #fff;
      margin: 20px auto;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      max-width: 600px;
      animation: slideUp 1.5s ease-in-out;
    }
    .share-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #ff6b81;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s;
    }
    .share-btn:hover {
      background: #ff4757;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
    @keyframes slideUp {
      from {transform: translateY(50px); opacity: 0;}
      to {transform: translateY(0); opacity: 1;}
    }
  </style>
</head>
<body>
  <header>
    <h1>Құрметті қонақ!</h1>
    <p>Сізді ұзату тойға шақырамыз 🎉</p>
  </header>
  <div class="invite">
    <h2>📅 15 қазан 2025 жыл</h2>
    <h3>📍 Алматы қаласы, «Сұлтан» мейрамханасы</h3>
    <p>Әсем кештің қонағы болуға асығыңыз 💐</p>
    <button class="share-btn" onclick="shareInvite()">Сілтемені бөлісу 🔗</button>
  </div>

  <script>
    function shareInvite() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: 'Ұзату тойға шақыру',
          text: 'Менімен бірге ұзату тойға кел!',
          url: url
        });
      } else {
        navigator.clipboard.writeText(url);
        alert("Сілтеме көшірілді: " + url);
      }
    }
  </script>
</body>
</html>
